apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: worker-inventory
  name: worker-inventory
spec:
  replicas: 2
  selector:
    matchLabels:
      app: worker-inventory
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
  template:
    metadata:
      labels:
        app: worker-inventory
    spec:
      containers:
      - image: elizabethhuang/laravel13:1.0
        name: worker-inventory
        restartPolicy: Always
        envFrom:
          - secretRef:
              name: api
          - configMapRef:
              name: api
        env:
          - name: DB_PASSWORD
            valueFrom:
              secretKeyRef:
                name: postgres-pwd
                key: PASSWORD
        command: ["php", "artisan", "queue:work", "--queue=inventory"]
        readinessProbe:
          exec:
            command:
              - php
              - artisan
              - readiness
        resources: {}
status: {}
