apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: api
  name: api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api
  strategy: {}
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
      - name: nginx
        image: elizabethhuang/nginx
        ports:
        - containerPort: 80
        resources: {}
        restartPolicy: Always
      initContainers:
      - name: php-fpm
        image: elizabethhuang/laravel51
        ports:
        - containerPort: 9000
        restartPolicy: Always
status: {}
